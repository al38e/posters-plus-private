# fly.toml app configuration file generated for posters-plus-private on 2026-11-05T09:09:54Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "posters-plus-private"
primary_region = 'fra'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '2gb'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '4gb'
  memory_mb = 4096
  processes = ['app']
  size = 'shared-cpu-2x'

[[restart]]
  policy = 'on-failure'
  processes = ['app']
  retries = 0
